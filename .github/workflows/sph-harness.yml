name: spare_parts_hub harness

# Pinned Odoo CE harness for spare_parts_hub (moved from odoo-contributions
# custom-modules/spare-parts-hub-poc, branch sph/poc). Runs only when the
# folder or this workflow changes.
on:
  push:
    branches: ['19.0', '20.0']
    paths:
      - 'spare_parts_hub/**'
      - '.github/workflows/sph-harness.yml'
  pull_request:
    branches: ['19.0', '20.0']
    paths:
      - 'spare_parts_hub/**'
      - '.github/workflows/sph-harness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sph-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: spare_parts_hub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # upgrade_path / baseline_diff compare with commits from before the subtree import
          fetch-depth: 0
      - name: Static pins and drift negative controls
        run: |
          python3 scripts/check_pins.py
          python3 scripts/test_pin_guard.py
          python3 scripts/test_live_suite.py
          python3 scripts/test_test_results.py
      - name: Clean module install and smoke test
        run: python3 scripts/harness.py test
      - name: Verify one-command UI startup from a disposable database
        run: python3 scripts/harness.py up
      - name: Live-harness suite (G1 HTTP / G2 race)
        run: python3 scripts/live_suite.py
      - name: Surface failures as annotations
        # Logs live in the artifact (not readable everywhere); repeat the essential lines as annotations.
        if: failure()
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          seen = 0
          def walk(node, path=''):
              # JSON evidence: report every FAIL status / false check with its path.
              if isinstance(node, dict):
                  for key, value in node.items():
                      here = f'{path}.{key}' if path else key
                      if (key in ('status', 'result') and value == 'FAIL') or value is False:
                          yield here, node
                      yield from walk(value, here)
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      yield from walk(value, f'{path}[{index}]')
          import xml.etree.ElementTree as ET
          for path in sorted(pathlib.Path('evidence').glob('**/*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for tag in ('failure', 'error', 'skipped'):
                      node = case.find(tag)
                      if node is not None:
                          text = ' | '.join(((node.get('message') or '') + ' ' + (node.text or '')).split('\n'))[:850]
                          print(f"::error title={path.name} {case.get('name')} {tag}::{text}")
                          seen += 1
          for path in sorted(pathlib.Path('evidence').glob('**/*.json')):
              try:
                  data = json.loads(path.read_text())
              except ValueError:
                  continue
              for where, node in walk(data):
                  brief = {k: v for k, v in node.items() if not isinstance(v, (dict, list))}
                  print(f"::error title={path.name} {where[:60]}::{json.dumps(brief)[:800]}")
                  seen += 1
                  if seen >= 40:
                      raise SystemExit(0)
          for path in sorted(pathlib.Path('evidence').glob('**/*')):
              if not path.is_file() or path.suffix not in ('.log', '.json', '.txt', '.xml'):
                  continue
              lines = path.read_text(errors='replace').splitlines()
              for i, line in enumerate(lines):
                  if re.search(r'(ERROR|CRITICAL|Traceback|AssertionError|FAIL[: ]|"status": "FAIL")', line):
                      tail = ' | '.join(l.strip() for l in lines[i:i + 12])
                      print(f"::error title={path.name}::{tail[:900]}")
                      seen += 1
                      if seen >= 25:
                          raise SystemExit(0)
          PY
      - name: Always remove this harness's containers and volumes
        if: always()
        run: python3 scripts/harness.py down
      - name: Preserve version metadata and synthetic test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sph-harness-evidence
          path: spare_parts_hub/evidence/
          if-no-files-found: ignore
          retention-days: 7

# gitaggregate configuration
# Usage: pip install git-aggregator && gitaggregate -c repos.yml
#
# This pulls OCA modules from our forks (with pending migration PRs)
# Once PRs are merged upstream, switch remotes from monthop → oca

./server-ux:
  remotes:
    oca: https://github.com/OCA/server-ux.git
    monthop: https://github.com/monthop-gmail/server-ux.git
  merges:
    - oca 19.0
    - monthop 19.0-mig-base_tier_validation
    - monthop 19.0-mig-base_tier_validation_formula
  target: monthop merge-19.0

./l10n-thailand:
  remotes:
    oca: https://github.com/OCA/l10n-thailand.git
    monthop: https://github.com/monthop-gmail/l10n-thailand.git
  merges:
    - oca 19.0
    - monthop 19.0-mig-l10n_th_account_tax
    - monthop 19.0-mig-l10n_th_account_tax_report
    - monthop 19.0-mig-l10n_th_account_wht_cert_form
    - monthop 19.0-mig-l10n_th_mis_report
    # l10n_th_partner: merged upstream (PR #586) — no longer needed
    - monthop 19.0-mig-l10n_th_tier_department
    - monthop 19.0-mig-l10n_th_tier_department_demo
  target: monthop merge-19.0
  fetch_all: true
  shell_command_after:
    # resolve .codecov.yml conflicts from multiple branches
    - rm -f .codecov.yml && git add -A && git diff --cached --quiet || git commit --no-verify -m "[AGG] remove .codecov.yml (not needed in aggregate)"

./partner-contact:
  remotes:
    oca: https://github.com/OCA/partner-contact.git
  merges:
    - oca 19.0
    # partner_company_type: merged upstream (PR #2302) — no longer needed
  target: oca 19.0

./mis-builder:
  remotes:
    oca: https://github.com/OCA/mis-builder.git
    versada: https://github.com/versada/mis-builder.git
  merges:
    - oca 19.0
    - versada 19.0-mig-mis_builder
  target: versada merge-19.0

./reporting-engine:
  remotes:
    oca: https://github.com/OCA/reporting-engine.git
  merges:
    - oca 19.0
  target: oca 19.0
